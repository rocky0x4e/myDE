[colors]
background=#ffffffd0
text=#28282dff
prompt=#fb607fff
placeholder=#838ba7ff
input=#28282dff
match=#99d1dbff
selection=#7aa2f7ff
selection-text=#28282dff
selection-match=#fb607fff
counter=#838ba7ff
border=#7aa2f7ff
message=#2a814dff

[main]
prompt="? "
icon-theme=Papirus
keyboard-focus=on-demand
layer=overlay
anchor=center
lines=30
tabs=4
horizontal-pad=24
vertical-pad=10
inner-pad=10
exit-on-keyboard-focus-loss=yes
line-height=25
font=Agave Nerd Font Mono:size=15
enable-mouse=yes
dpi-aware=no
minimal-lines=no
match-counter=yes

[border]
width=0
selection-radius=8

[key-bindings]
next=none
prev=none
next-with-wrap=Down Control+n
prev-with-wrap=Up Control+p

[dmenu]
mode=text
exit-immediately-if-empty=yes