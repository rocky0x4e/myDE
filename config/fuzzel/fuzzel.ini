[colors]
background=#28282df0
text=#fdfdfdff
prompt=#fb607fff
placeholder=#838ba7ff
input=#fdfdfdff
match=#99d1dbff
selection=#7b68eeff
selection-text=#fdfdfdff
selection-match=#ffcc55ff
counter=#838ba7ff
border=#7b68eeff
message=#2a814dff

[main]
prompt="What? > "
icon-theme=Papirus
keyboard-focus=on-demand
layer=overlay
anchor=center
lines=30
tabs=4
horizontal-pad=24
vertical-pad=10
inner-pad=10
exit-on-keyboard-focus-loss=yes
line-height=30
font=Agave Nerd Font Mono:size=15
enable-mouse=yes
dpi-aware=auto
minimal-lines=no
match-counter=yes

[border]
width=2
radius=10
selection-radius=5

[key-bindings]
next=none
prev=none
next-with-wrap=Down Control+n
prev-with-wrap=Up Control+p

[dmenu]
mode=text